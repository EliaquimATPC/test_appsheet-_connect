<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estación Apaseo el Alto</title>
    <style>
        :root {
            --card-width: 300px;
            --card-height: 210px;
            --bg-1: rgba(80, 84, 94, 0.97);
            --bg-2: rgba(16, 28, 58, 0.97);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-border-top: rgba(255, 255, 255, 0.28);
            --accent: rgba(99, 179, 237, 1);
            --accent-glow: rgba(99, 179, 237, 0.25);
            --text-primary: rgba(255, 255, 255, 0.97);
            --text-secondary: rgba(200, 220, 255, 0.7);
            --pill-bg: rgba(255, 255, 255, 0.07);
            --pill-border: rgba(255, 255, 255, 0.14);
            --shadow-card: 0 16px 40px rgba(0, 0, 0, 0.45), 0 4px 12px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 24px 60px rgba(0, 0, 0, 0.55), 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(99, 179, 237, 0.2);
            --transition: 0.35s cubic-bezier(0.25, 0.1, 0.25, 1);
            --transition-bounce: 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            --temp-glow: rgba(99, 179, 237, 0.35);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: transparent;
            font-family: 'Inter', 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            perspective: 900px;
        }
        .weather-card {
            width: var(--card-width);
            height: var(--card-height);
            position: relative;
            border-radius: 20px;
            cursor: pointer;
            overflow: hidden;
            transform-style: preserve-3d;
            background: linear-gradient(145deg, var(--bg-1) 0%, var(--bg-2) 100%);
            box-shadow: var(--shadow-card);
            border: 1px solid var(--glass-border);
            transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
        }
        .weather-card::before {
            content: '';
            position: absolute;
            top: 0; left: 8%; width: 84%; height: 1px;
            background: linear-gradient(90deg,
                transparent 0%, var(--glass-border-top) 30%,
                rgba(121, 110, 110, 0.5) 50%, var(--glass-border-top) 70%, transparent 100%);
            z-index: 10;
            pointer-events: none;
        }
        .weather-card:hover {
            box-shadow: var(--shadow-hover);
            border-color: rgba(99, 179, 237, 0.3);
        }
        .weather-card.is-freezing  { --accent: rgba(147,210,255,1); --temp-glow: rgba(147,210,255,0.3); --bg-2: rgba(19, 67, 201, 0.98); }
        .weather-card.is-cold      { --accent: rgba(96,165,250,1);  --temp-glow: rgba(96,165,250,0.3);  --bg-2: rgba(29, 54, 122, 0.98); }
        .weather-card.is-mild      { --accent: rgba(52,211,153,1);  --temp-glow: rgba(52,211,153,0.3);  --bg-2: rgba(12, 95, 60, 0.98); }
        .weather-card.is-warm      { --accent: rgba(251,191,36,1);  --temp-glow: rgba(251,191,36,0.3);  --bg-2: rgba(136, 77, 18, 0.98); }
        .weather-card.is-hot       { --accent: rgba(251,113,59,1);  --temp-glow: rgba(251,113,59,0.3);  --bg-2: rgb(109, 13, 13); }
        .weather-card.has-rain     { --accent: rgba(96,165,250,1);  --temp-glow: rgba(96,165,250,0.3);  --bg-2: rgb(6, 20, 53); }
        .particles {
            position: absolute; inset: 0;
            pointer-events: none; z-index: 1;
        }
        .particle {
            position: absolute;
            background: var(--accent);
            border-radius: 50%;
            bottom: -16px;
            animation: floatUpMote linear infinite;
            opacity: 0;
            filter: blur(0.8px);
        }
        @keyframes floatUpMote {
            0%   { transform: translateY(0) scale(0.4); opacity: 0; }
            10%  { opacity: 0.45; }
            85%  { opacity: 0.06; }
            100% { transform: translateY(-220px) scale(1.2); opacity: 0; }
        }
        .rain-container {
            position: absolute; inset: 0;
            pointer-events: none; z-index: 2;
        }
        .drop {
            position: absolute;
            top: -50px;
            width: 1px;
            background: linear-gradient(to bottom,
                rgba(99,179,237,0) 0%, rgb(18, 73, 190) 40%,
                rgb(27, 130, 194) 70%, rgb(0, 68, 255) 100%);
            border-radius: 1px;
            animation: fallRain linear infinite paused;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .weather-card.has-rain .drop { animation-play-state: running; opacity: 1; }
        .weather-card:not(.has-rain) .drop { animation-play-state: paused; opacity: 0; }
        @keyframes fallRain {
            0%   { transform: translateY(0); }
            100% { transform: translateY(260px); }
        }
        .temp-glow-orb {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 140px; height: 70px;
            border-radius: 50%;
            background: radial-gradient(ellipse, var(--temp-glow) 0%, transparent 70%);
            pointer-events: none;
            z-index: 2;
            transition: background var(--transition);
        }
        .weather-icon {
            position: absolute;
            top: 14px; right: 16px;
            z-index: 6;
            font-size: 1.8rem;
            pointer-events: none;
            filter: drop-shadow(0 0 8px var(--temp-glow));
            animation: iconPulse 4s ease-in-out infinite;
            transition: filter var(--transition), transform var(--transition-bounce);
        }
        .weather-card:hover .weather-icon {
            transform: scale(1.2) translateY(-2px);
            filter: drop-shadow(0 0 14px var(--temp-glow));
        }
        @keyframes iconPulse {
            0%, 100% { filter: drop-shadow(0 0 6px var(--temp-glow)); }
            50%       { filter: drop-shadow(0 0 14px var(--temp-glow)); }
        }
        .card-content {
            position: relative;
            z-index: 6;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 14px 18px 12px;
        }
        .card-header {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding-right: 56px;
        }
        .station-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 999px;
            background: rgba(113, 114, 117, 0.671);
            border: 1px solid var(--pill-border);
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--text-secondary);
            width: fit-content;
        }
        .station-name {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.2px;
            color: var(--text-primary);
            text-shadow: 0 1px 8px rgba(0,0,0,0.6);
            line-height: 1.2;
        }
        .weather-card:hover .station-name {
            transform: scale(1.2) translateX(15px);
            filter: drop-shadow(0 0 14px var(--temp-glow));
            color: var(--accent);
        }
        .temperature-block {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1px;
            margin-top: -4px;
        }
        .temperature {
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -1px;
            color: var(--accent);
            text-shadow: 0 0 32px var(--temp-glow), 0 2px 8px rgba(0,0,0,0.5);
            font-variant-numeric: tabular-nums;
            transition: color var(--transition), text-shadow var(--transition);
        }
        .weather-card:hover .temperature {
            transform: scale(1.1) translateY(-1px);
            filter: drop-shadow(0 0 14px var(--temp-glow));
        }
        .temperature-status {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: .7rem;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: var(--text-secondary);
        }
        .metrics-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 0px;
        }
        .metric-pill {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            padding: 5px 4px;
            background: var(--pill-bg);
            border: 1px solid var(--pill-border);
            border-radius: 10px;
            transition: background var(--transition), border-color var(--transition);
            color:rgb(254, 255, 255)
        }
        .weather-card:hover .metric-pill {
            background: rgba(0, 0, 0, 0.74);
            border-color: rgba(255,255,255,0.2);
            color: rgb(255, 255, 255);
        }
        .metric-icon { font-size: .9rem; line-height: 1; }
        .metric-value {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.2px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }
    
        .metric-label {
            font-size: 0.48rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-secondary);
        }
        .wind-arrow { display: inline-block; transition: transform 0.4s ease; line-height: 1; }
        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 5px;
        }
        .live-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.54rem;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: var(--text-secondary);
        }
        .live-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #ef4444;
            box-shadow: 0 0 6px rgba(239,68,68,0.8);
            animation: offlinePulse 2s ease-in-out infinite;
            flex-shrink: 0;
        }
        .live-indicator.is-live .live-dot {
            background: #22c55e;
            box-shadow: 0 0 6px rgba(34,197,94,0.8);
            animation: livePulse 2s ease-in-out infinite;
        }
        @keyframes offlinePulse {
            0%, 100% { transform: scale(1);   box-shadow: 0 0 6px rgba(239,68,68,0.8); }
            50%       { transform: scale(1.4); box-shadow: 0 0 12px rgba(239,68,68,1); }
        }
        @keyframes livePulse {
            0%, 100% { transform: scale(1);   box-shadow: 0 0 6px rgba(34,197,94,0.8); }
            50%       { transform: scale(1.4); box-shadow: 0 0 12px rgba(34,197,94,1); }
        }
        .location-pill {
            display: inline-flex;
            align-items: center;
            gap: 0px;
            padding: 3px 8px;
            background: var(--pill-bg);
            border: 1px solid var(--pill-border);
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        @media (max-width: 420px) {
            .weather-card { width: 92vw; height: auto; min-height: 190px; border-radius: 18px; }
            .temperature { font-size: 2.5rem; }
            .station-name { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="weather-card" id="weatherCard" title="Clic para ver datos">
        <div class="particles" id="particles"></div>
        <div class="rain-container" id="rainContainer"></div>
        <div class="temp-glow-orb"></div>
        <span class="weather-icon" id="weatherIcon" aria-hidden="true">&#x1F321;&#xFE0F;</span>

        <div class="card-content">
            <div class="card-header">
                <span class="station-badge">&#x26A1; Estaci&#xF3;n Meteorol&#xF3;gica</span>
                <span class="station-name">Apaseo el Alto</span>
            </div>
            <div class="temperature-block">
                <span class="temperature" id="tempValue" aria-live="polite">-- &#xB0;C</span>
                <span class="temperature-status">
                    <span id="temperatureIcon" aria-hidden="true">&#x1F321;</span>
                    <span id="temperatureLabel">--</span>
                </span>
            </div>
            <div class="metrics-row">
                <div class="metric-pill">
                    <span class="metric-icon">&#x1F327;</span>
                    <span class="metric-value" id="rainValue">-- mm</span>
                    <span class="metric-label">Lluvia</span>
                </div>
                <div class="metric-pill">
                    <span class="metric-icon">&#x1F4A8;</span>
                    <span class="metric-value" id="windSpeedValue">-- km/h</span>
                    <span class="metric-label">Viento</span>
                </div>
                <div class="metric-pill">
                    <span class="metric-icon wind-arrow" id="windDirectionIcon">&#x2014;</span>
                    <span class="metric-value" id="windDirectionLabel">--</span>
                    <span class="metric-label">Direcci&#xF3;n</span>
                </div>
            </div>
            <div class="card-footer">
                <div class="live-indicator" id="liveIndicator">
                    <span class="live-dot"></span>
                    En vivo
                </div>
                <span class="location-pill">📍Apaseo el Alto, Gto</span>
            </div>
        </div>
    </div>
    <script>
        (function () {
            var particlesContainer = document.getElementById('particles');
            for (var i = 0; i < 20; i++) {
                var p = document.createElement('div');
                p.classList.add('particle');
                var sz = Math.random() * 2.5 + 0.8;
                p.style.cssText = 'width:' + sz + 'px;height:' + sz + 'px;left:' + (Math.random()*92) + '%;' +
                    'animation-duration:' + (Math.random()*7+9) + 's;animation-delay:' + (Math.random()*12) + 's';
                particlesContainer.appendChild(p);
            }
            var rainContainer = document.getElementById('rainContainer');
            for (var j = 0; j < 40; j++) {
                var d = document.createElement('div');
                d.classList.add('drop');
                d.style.cssText = 'left:' + (Math.random()*96) + '%;height:' + (Math.random()*16+8) + 'px;' +
                    'animation-duration:' + (Math.random()*0.6+0.55) + 's;animation-delay:' + (Math.random()*3) + 's;' +
                    'width:' + (Math.random()*0.5+0.7) + 'px';
                rainContainer.appendChild(d);
            }
            var card           = document.getElementById('weatherCard');
            var tempValueEl    = document.getElementById('tempValue');
            var rainValueEl    = document.getElementById('rainValue');
            var windSpeedEl    = document.getElementById('windSpeedValue');
            var windDirIconEl  = document.getElementById('windDirectionIcon');
            var windDirLabelEl = document.getElementById('windDirectionLabel');
            var tempIconEl     = document.getElementById('temperatureIcon');
            var tempLabelEl    = document.getElementById('temperatureLabel');
            var liveIndicator  = document.getElementById('liveIndicator');
            var weatherIconEl  = document.getElementById('weatherIcon');
            var BANDS = ['is-freezing','is-cold','is-mild','is-warm','is-hot'];
            var DIR_ANGLES = {
                N:0,NNE:22.5,NE:45,ENE:67.5,E:90,ESE:112.5,SE:135,SSE:157.5,
                S:180,SSW:202.5,SW:225,WSW:247.5,W:270,WNW:292.5,NW:315,NNW:337.5
            };
            var stationKey = (window.location.pathname.split('/').pop() || 'apaseoalto.html')
                .replace(/\.html?$/i, '').trim().toLowerCase();
            var weatherUrl = 'https://www.weatherlink.com/embeddablePage/show/3f51dabcd7194bfeb01298ee07821187/summary';
            function applyBand(temp) {
                card.classList.remove.apply(card.classList, BANDS);
                if (!isFinite(temp)) {
                    tempIconEl.textContent = '\uD83C\uDF21'; tempLabelEl.textContent = '--';
                    weatherIconEl.textContent = '\uD83C\uDF21\uFE0F'; return;
                }
                var cfg = temp <= 0
                    ? ['is-freezing','\u2744\uFE0F','Helada','\u2744\uFE0F']
                    : temp <= 10 ? ['is-cold','\u2744\uFE0F','Fr\xEDo','\uD83C\uDF28\uFE0F']
                    : temp <= 20 ? ['is-mild','\u26C5','Templado','\u26C5']
                    : temp <= 30 ? ['is-warm','\u2600\uFE0F','C\xE1lido','\u2600\uFE0F']
                    : ['is-hot','\uD83D\uDD25','Calor','\uD83C\uDF1E'];
                card.classList.add(cfg[0]);
                tempIconEl.textContent = cfg[1]; tempLabelEl.textContent = cfg[2];
                weatherIconEl.textContent = cfg[3];
            }
            function applyWind(raw) {
                var m = (raw || '').match(/^(NNE|ENE|ESE|SSE|SSW|WSW|WNW|NNW|N|NE|E|SE|S|SW|W|NW)\b/i);
                var dir = m ? m[0].toUpperCase() : null;
                var angle = dir !== null ? DIR_ANGLES[dir] : undefined;
                windDirLabelEl.textContent = dir || '--';
                windDirIconEl.textContent  = dir ? '\u2191' : '\u2014';
                windDirIconEl.style.transform = dir ? 'rotate(' + ((angle + 180) % 360) + 'deg)' : '';
            }
            function loadData() {
                fetch('./Rdata2.csv', { cache: 'no-store' })
                    .then(function(res) { if (!res.ok) throw new Error('CSV unavailable'); return res.text(); })
                    .then(function(text) {
                        var rows = text.trim().split(/\r?\n/).slice(1).filter(Boolean);
                        var row = null;
                        for (var k = 0; k < rows.length; k++) {
                            var parts = rows[k].split(',').map(function(v){ return v.trim(); });
                            if (parts[0] && parts[0].toLowerCase() === stationKey && isFinite(Number(parts[1]))) {
                                row = parts; break;
                            }
                        }
                        if (row) {
                            liveIndicator.classList.add('is-live');
                            var t = Number(row[1]);
                            applyBand(t);
                            tempValueEl.textContent  = row[1] + ' \xB0C';
                            tempValueEl.title        = 'Temperatura: ' + row[1] + ' \xB0C';
                            rainValueEl.textContent  = row[2] ? row[2] + ' mm' : '-- mm';
                            windSpeedEl.textContent  = row[3] ? row[3] + ' km/h' : '-- km/h';
                            applyWind(row[4] || '');
                            var rainAmt = Number(row[2]);
                            if (!isNaN(rainAmt) && rainAmt > 0) {
                                card.classList.add('has-rain');
                                weatherIconEl.textContent = '\uD83C\uDF27\uFE0F';
                            } else {
                                card.classList.remove('has-rain');
                            }
                        } else {
                            liveIndicator.classList.remove('is-live');
                            applyBand(NaN);
                        }
                    })
                    .catch(function(e) {
                        console.warn('Weather data error:', e);
                        liveIndicator.classList.remove('is-live');
                        applyBand(NaN);
                    });
            }
            loadData();
            card.setAttribute('tabindex', '0');
            card.setAttribute('role', 'button');
            card.setAttribute('aria-label', 'Ver datos de la estación meteorológica Apaseo el Alto');
            card.addEventListener('click', function() { window.open(weatherUrl, '_blank', 'noopener,noreferrer'); });
            card.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); window.open(weatherUrl, '_blank', 'noopener,noreferrer'); }
            });
            card.addEventListener('mousemove', function(e) {
                var r = card.getBoundingClientRect();
                var rx = ((e.clientY - r.top  - r.height/2) / (r.height/2)) * -7;
                var ry = ((e.clientX - r.left - r.width/2)  / (r.width/2))  *  7;
                card.style.transform = 'translateY(-4px) scale(1.02) perspective(800px) rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)';
            });
            card.addEventListener('mouseleave', function() { card.style.transform = ''; });
            card.addEventListener('touchmove', function(e) {
                var r = card.getBoundingClientRect();
                var t = e.touches[0];
                var rx = ((t.clientY - r.top  - r.height/2) / (r.height/2)) * -5;
                var ry = ((t.clientX - r.left - r.width/2)  / (r.width/2))  *  5;
                card.style.transform = 'translateY(-2px) scale(1.01) perspective(800px) rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)';
            }, { passive: true });
            card.addEventListener('touchend', function() { card.style.transform = ''; });
        })();
    </script>
</body>
</html>
